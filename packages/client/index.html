<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOGFIGHT — Pixel Art Airplane Combat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen overflow-hidden select-none font-sans">
    <div id="app" class="relative w-screen h-screen flex items-center justify-center bg-slate-950">
      <!-- Phaser Canvas Container -->
      <div id="game-container" class="absolute inset-0 z-0 overflow-hidden"></div>

      <!-- HTML/Tailwind UI Overlay Layer -->
      <div id="ui-overlay" class="absolute inset-0 z-10 pointer-events-none flex flex-col justify-between p-4 sm:p-6 select-none"></div>

      <!-- Toast Notification Container -->
      <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none max-w-sm w-full px-4"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
